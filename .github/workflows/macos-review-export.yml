name: Export verified macOS review artifacts
# Review transport only. The app was tested/built in this existing run; this
# workflow never rebuilds, signs, publishes a release or changes app contents.
on:
  push:
    branches: ['codex/macos-native']
    paths: ['.github/workflows/macos-review-export.yml']
permissions:
  actions: read
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        group: [zip, dmg, screenshots]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FontPocket-macOS-0.3.0-universal
          path: review
          github-token: ${{ github.token }}
          run-id: 42996946296
      - name: Export bounded verified files
        env:
          REVIEW_GROUP: ${{ matrix.group }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, os
          from pathlib import Path
          root = Path('review')
          group = os.environ['REVIEW_GROUP']
          if group in ('zip', 'dmg'):
              paths = [root / ('FontPocket-macOS-0.3.0-universal.' + group)]
          else:
              names = ('manager-light.png', 'manager-dark.png', 'manager-accessible.png',
                       'install-ko.png', 'characters-ko.png', 'collections-ko.png',
                       'characters-dark-ko.png', 'collections-dark-ko.png',
                       'backup-dark-ko.png', 'backup-progress-dark-ko.png',
                       'catalog-ko.png', 'quick-search-ko.png')
              paths = [next(root.rglob(name)) for name in names]
          for path in paths:
              data = path.read_bytes()
              print('FP_EXPORT_BEGIN:' + path.name + ':' + hashlib.sha256(data).hexdigest())
              encoded = base64.b64encode(data).decode('ascii')
              for offset in range(0, len(encoded), 12000):
                  print('FP_EXPORT_DATA:' + encoded[offset:offset + 12000])
              print('FP_EXPORT_END:' + path.name)
          PY
